name: Keep Render Free service awake during market hours

on:
  schedule:
    - cron: "50 2 * * 1-5" # 08:20 IST, Mon-Fri
    - cron: "10 9 * * 1-5" # 14:40 IST, Mon-Fri

permissions:
  contents: read

jobs:
  morning-to-afternoon:
    if: github.event.schedule == '50 2 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      RENDER_URL: https://ravialgo.onrender.com
      STOP_HOUR: "14"
      STOP_MINUTE: "50"
    steps:
      - name: Ping Render every five minutes until 2:50 PM IST
        run: |
          python - <<'PY'
          import os, time
          from datetime import datetime
          from urllib.request import urlopen
          from zoneinfo import ZoneInfo

          ist = ZoneInfo("Asia/Kolkata")
          url = os.environ["RENDER_URL"].rstrip("/") + "/ping"
          stop = datetime.now(ist).replace(
              hour=int(os.environ["STOP_HOUR"]),
              minute=int(os.environ["STOP_MINUTE"]), second=0, microsecond=0)
          while datetime.now(ist) < stop:
              try:
                  with urlopen(url, timeout=90) as response:
                      print(f"{datetime.now(ist):%H:%M:%S IST}: Render ping {response.status}", flush=True)
              except Exception as exc:
                  print(f"{datetime.now(ist):%H:%M:%S IST}: ping failed: {exc}", flush=True)
              time.sleep(300)
          PY

  afternoon-to-close:
    if: github.event.schedule == '10 9 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RENDER_URL: https://ravialgo.onrender.com
      STOP_HOUR: "15"
      STOP_MINUTE: "50"
    steps:
      - name: Ping Render every five minutes until 3:50 PM IST
        run: |
          python - <<'PY'
          import os, time
          from datetime import datetime
          from urllib.request import urlopen
          from zoneinfo import ZoneInfo

          ist = ZoneInfo("Asia/Kolkata")
          url = os.environ["RENDER_URL"].rstrip("/") + "/ping"
          stop = datetime.now(ist).replace(
              hour=int(os.environ["STOP_HOUR"]),
              minute=int(os.environ["STOP_MINUTE"]), second=0, microsecond=0)
          while datetime.now(ist) < stop:
              try:
                  with urlopen(url, timeout=90) as response:
                      print(f"{datetime.now(ist):%H:%M:%S IST}: Render ping {response.status}", flush=True)
              except Exception as exc:
                  print(f"{datetime.now(ist):%H:%M:%S IST}: ping failed: {exc}", flush=True)
              time.sleep(300)
          PY

