name: Auto Run Trading Script

on:
  schedule:
    # सोमवार ते शुक्रवार सकाळी 9:01 IST (03:31 UTC)
    - cron: '31 3 * * 1-5'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Script
        timeout-minutes: 360
        run: python main.py
