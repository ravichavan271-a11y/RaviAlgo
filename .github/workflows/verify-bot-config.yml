name: Verify bot source syntax

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "oauth_flow.py"
      - "option_bot.py"
      - "Upstock5.py"
      - "silly_app.py"
      - ".github/workflows/verify-bot-config.yml"
  pull_request:
    branches: [main]
    paths:
      - "main.py"
      - "oauth_flow.py"
      - "option_bot.py"
      - "Upstock5.py"
      - "silly_app.py"
      - ".github/workflows/verify-bot-config.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile scheduled app and bot sources
        run: python -m py_compile main.py oauth_flow.py option_bot.py Upstock5.py silly_app.py

